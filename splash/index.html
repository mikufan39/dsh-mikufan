<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050507">
<meta name="od-motion-output" content="interactive">
<title>DeepSeek Harness — 开屏动画</title>
<meta name="description" content="DeepSeek Harness 开屏动画：光点汇聚成 DeepSeek 鲸标，五秒，一次。">
<style>
/* ─────────────────────────────────────────────────────────────────────────
 * 1 · Apple design-system tokens (verbatim contract)
 * ───────────────────────────────────────────────────────────────────────── */
:root {
  /* ─── Surface (3 levels) ────────────────────────────────────────── */
  --bg: #ffffff;
  --surface: #f5f5f7;
  --surface-warm: #fbfbfd;

  /* ─── Foreground ramp (4 levels) ───────────────────────────────── */
  --fg: #1d1d1f;
  --fg-2: #424245;
  --muted: #6e6e73;
  --meta: #86868b;

  /* ─── Border (2 levels) ────────────────────────────────────────── */
  --border: #d2d2d7;
  --border-soft: #e8e8ed;

  /* ─── Accent ────────────────────────────────────────────────────── */
  --accent: #0071e3;
  --accent-on: #ffffff;

  /* ─── Accent states ─────────────────────────────────────────────── */
  --accent-hover: #0077ed;
  --accent-active: #0066cc;

  /* ─── Semantic ──────────────────────────────────────────────────── */
  --success: #16a34a;
  --warn:    #eab308;
  --danger:  #dc2626;

  /* ─── Typography ────────────────────────────────────────────────── */
  --font-display:
    "SF Pro Display", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body:
    "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono:
    "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;

  /* Type scale (px) */
  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 17px;
  --text-lg:   21px;
  --text-xl:   28px;
  --text-2xl:  40px;
  --text-3xl:  56px;
  --text-4xl:  80px;

  --leading-body:  1.47;
  --leading-tight: 1.05;
  --tracking-display: -0.015em;

  /* ─── Spacing ───────────────────────────────────────────────────── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* ─── Section rhythm ────────────────────────────────────────────── */
  --section-y-desktop: 100px;
  --section-y-tablet:  64px;
  --section-y-phone:   40px;

  /* ─── Radius ────────────────────────────────────────────────────── */
  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   18px;
  --radius-pill: 980px;

  /* ─── Elevation (3 levels) ──────────────────────────────────────── */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: 0 12px 32px rgba(0, 0, 0, 0.08);

  /* ─── Focus ring ────────────────────────────────────────────────── */
  --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 65%);

  /* ─── Motion ────────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   220ms;
  --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);

  /* ─── Layout ────────────────────────────────────────────────────── */
  --container-max:            1024px;
  --container-gutter-desktop: 22px;
  --container-gutter-tablet:  18px;
  --container-gutter-phone:   16px;
}

/* ─────────────────────────────────────────────────────────────────────────
 * 2 · Stage-local values
 *     The near-black field is the value named in the brief (#050507);
 *     ink is the brand surface token, never a new colour.
 * ───────────────────────────────────────────────────────────────────────── */
:root {
  --stage-bg: #050507;
  --brand-blue: #4d6bfe;
  --mark-ink: var(--surface);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--stage-bg);
  color: var(--surface);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
    "Helvetica Neue", "Segoe UI", Helvetica, Arial, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ── Stage ────────────────────────────────────────────────────────────── */
#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--stage-bg);
}

.stage-inner {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1920px;
  height: 1080px;
  transform: translate(-50%, -50%) scale(1);
  transform-origin: 50% 50%;
  background: var(--stage-bg);
  overflow: hidden;
  will-change: transform;
}

#fx {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
}

/* light shaping only: vignette + a barely-there centre lift */
.stage-inner::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(120% 118% at 50% 44%, rgba(5, 5, 7, 0) 38%, rgba(5, 5, 7, 0.66) 100%),
    radial-gradient(58% 52% at 50% 44%, rgba(245, 245, 247, 0.05), rgba(245, 245, 247, 0) 72%);
}

.hero {
  position: absolute;
  inset: 0;
  z-index: 2;
  transform-origin: 960px 500px;
  will-change: transform;
}

/* ── Wordmark ─────────────────────────────────────────────────────────── */
.mark {
  position: absolute;
  inset: 0;
  margin: 0;
  font-weight: 400;
  pointer-events: none;
  opacity: 0;
  filter: blur(4px) drop-shadow(0 0 0 rgba(245, 245, 247, 0));
  transform: scale(1.006);
  transition:
    opacity 520ms var(--ease-standard),
    filter 640ms var(--ease-standard),
    transform 900ms var(--ease-standard);
}

.is-lit .mark {
  opacity: 1;
  filter: blur(0) drop-shadow(0 0 26px rgba(245, 245, 247, 0.18));
  transform: scale(1);
}

.mark-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.mark-svg path {
  fill: var(--mark-ink);
  stroke: none;
  shape-rendering: geometricPrecision;
}

/* ── Brand lockup: deepseek wordmark + HARNESS chip ───────────────────── */
.lockup {
  position: absolute;
  left: 0;
  right: 0;
  top: 690px;
  margin: 0;
  display: flex;
  justify-content: center;
  color: var(--surface);
  opacity: 0;
  transform: translateY(9px);
  transition:
    opacity 720ms var(--ease-standard),
    transform 720ms var(--ease-standard);
}

.lockup-svg {
  display: block;
  width: 320px;
  height: auto;
}

.is-named .lockup {
  opacity: 1;
  transform: translateY(0);
}

/* ── One breath, then rest ────────────────────────────────────────────── */
@keyframes hero-breath {
  0%   { transform: scale(1); }
  44%  { transform: scale(1.0115); }
  100% { transform: scale(1); }
}

.is-breathing .hero {
  animation: hero-breath 680ms var(--ease-standard) both;
}

/* ── Chrome ───────────────────────────────────────────────────────────── */
.chrome {
  position: fixed;
  right: max(18px, env(safe-area-inset-right, 0px));
  bottom: max(14px, env(safe-area-inset-bottom, 0px));
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transform: translateY(6px);
  pointer-events: none;
  transition:
    opacity 700ms var(--ease-standard) 120ms,
    transform 700ms var(--ease-standard) 120ms;
}

.is-done .chrome {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.ctl {
  appearance: none;
  border: 0;
  background: transparent;
  color: color-mix(in oklab, var(--surface) 52%, transparent);
  font: inherit;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 44px;
  padding: 0 14px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition:
    color 180ms var(--ease-standard),
    background-color 180ms var(--ease-standard),
    transform 180ms var(--ease-standard);
}

.ctl svg {
  width: 14px;
  height: 14px;
  flex: none;
  display: block;
}

.ctl svg path {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ctl-icon { width: 44px; padding: 0; }

.ctl:hover {
  color: color-mix(in oklab, var(--surface) 92%, transparent);
  background: color-mix(in oklab, var(--surface) 7%, transparent);
}

.ctl:active {
  color: color-mix(in oklab, var(--surface) 96%, transparent);
  background: color-mix(in oklab, var(--surface) 11%, transparent);
  transform: scale(0.97);
}

.ctl:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.ico-shrink { display: none; }
[aria-pressed="true"] .ico-expand { display: none; }
[aria-pressed="true"] .ico-shrink { display: block; }

/* instant reset, and poster mode */
.is-resetting .mark,
.is-resetting .lockup,
.is-resetting .chrome,
.is-still .mark,
.is-still .lockup,
.is-still .chrome {
  transition: none !important;
  animation: none !important;
}

/* ── Reduced motion: a wordmark fade, nothing travels ─────────────────── */
@media (prefers-reduced-motion: reduce) {
  .mark {
    filter: none;
    transform: none;
    transition: opacity 420ms linear;
  }
  .lockup {
    transform: none;
    transition: opacity 420ms linear;
  }
  .is-breathing .hero { animation: none; }

  .chrome { transform: none; }
}

@media print {
  #stage { position: relative; height: 1080px; }
  .chrome { display: none; }
}
</style>
</head>

<script>
(() => {
  'use strict';

  /* ══════════════════════════════════════════════════════════════════════
   * 1 · Tunables — every timing below is in seconds.
   * ══════════════════════════════════════════════════════════════════════ */
  const CONFIG = {
    duration: 5,
    stage: { w: 1920, h: 1080 },
    core: { x: 960, y: 460 },        // where light gathers; also the mark centre
    seed: 20260214,                  // deterministic field, identical on replay
    particleCount: 640,

    mark: {
      width: 480,                    // rendered width of the DeepSeek whale, px on the 1920 stage
      centerX: 960,
      centerY: 460
    },

    timeline: {
      ambientEnd: 1.20,    // drift only
      mergeEnd: 2.70,      // every trajectory has reached the core
      crushEnd: 3.00,      // the core compresses to a point
      flash: 3.05,         // soft bloom peak
      assembleStart: 3.08, // light leaves the core and writes the mark
      assembleEnd: 3.66,
      markIn: 3.60,        // vector mark begins to resolve
      dustStart: 3.80,     // particles release into dust
      dustEnd: 4.36,
      lockup: 3.98,
      breathe: 4.28,
      ui: 4.92,
      end: 5.00
    },

    look: {
      trail: 0.07,         // seconds of motion retained behind each point
      trailSamples: 3
    }
  };

  const TL = CONFIG.timeline;
  const CORE = CONFIG.core;
  const TAU = Math.PI * 2;

  const root = document.documentElement;
  const stageInner = document.getElementById('stage-inner');
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d', { alpha: false });
  const reducedQuery = matchMedia('(prefers-reduced-motion: reduce)');
  const still = location.hash === '#end' || root.hasAttribute('data-still');

  let reduced = reducedQuery.matches;

  /* ══════════════════════════════════════════════════════════════════════
   * 2 · Helpers
   * ══════════════════════════════════════════════════════════════════════ */
  const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const smooth = (a, b, x) => {
    const t = clamp01((x - a) / (b - a));
    return t * t * (3 - 2 * t);
  };

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const css = getComputedStyle(root);
  const readVar = name => css.getPropertyValue(name).trim();

  function toRGB(hex) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const mixRGB = (a, b, t) => [
    Math.round(lerp(a[0], b[0], t)),
    Math.round(lerp(a[1], b[1], t)),
    Math.round(lerp(a[2], b[2], t))
  ];
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  const BG = toRGB(readVar('--stage-bg') || '#050507');
  const INK = toRGB(readVar('--surface') || '#f5f5f7');
  const ACCENT = toRGB(readVar('--accent') || '#0071e3');
  const BORDER = toRGB(readVar('--border') || '#d2d2d7');
  const BG_CSS = `rgb(${BG[0]},${BG[1]},${BG[2]})`;
  const ICE = mixRGB(INK, ACCENT, 0.13);
  const BLUE = mixRGB(INK, ACCENT, 0.34);

  /* spectral restraint: white / soft grey / ice / one faint blue glint */
  const TINTS = [INK, BORDER, ICE, BLUE];
  const TINT_CSS = TINTS.map(c => `rgb(${c[0]},${c[1]},${c[2]})`);

  /* ══════════════════════════════════════════════════════════════════════
   * 3 · Brand mark geometry — fit the DeepSeek whale, then sample its fill
   * ══════════════════════════════════════════════════════════════════════ */
  const wordmarkGroup = document.getElementById('wordmark');
  const markPathEl = wordmarkGroup.querySelector('path');
  const markPath = new Path2D(markPathEl.getAttribute('d'));
  const markBox = markPathEl.getBBox();

  const MARK_K = CONFIG.mark.width / markBox.width;
  const MARK_X = CONFIG.mark.centerX - (markBox.x + markBox.width / 2) * MARK_K;
  const MARK_Y = CONFIG.mark.centerY - (markBox.y + markBox.height / 2) * MARK_K;
  const VX0 = markBox.x;
  const VX1 = markBox.x + markBox.width;

  wordmarkGroup.setAttribute('transform',
    `translate(${MARK_X.toFixed(3)} ${MARK_Y.toFixed(3)}) scale(${MARK_K.toFixed(4)})`);

  /* Every particle gets a target inside the real filled mark (plus a light
     outline trace), so the particle drawing and the final vector whale
     register exactly. */
  const targets = [];
  (function sampleTargets() {
    const rasterScale = 0.5;
    const w = Math.round(CONFIG.stage.w * rasterScale);
    const h = Math.round(CONFIG.stage.h * rasterScale);
    const probe = document.createElement('canvas');
    probe.width = w;
    probe.height = h;
    const pctx = probe.getContext('2d');
    pctx.setTransform(
      MARK_K * rasterScale, 0, 0, MARK_K * rasterScale,
      MARK_X * rasterScale, MARK_Y * rasterScale
    );
    pctx.fillStyle = '#fff';
    pctx.fill(markPath);
    const pixels = pctx.getImageData(0, 0, w, h).data;

    const pool = [];
    for (let y = 0; y < h; y += 2) {
      for (let x = 0; x < w; x += 2) {
        if (pixels[(y * w + x) * 4 + 3] > 128) {
          pool.push({ x: x / rasterScale, y: y / rasterScale });
        }
      }
    }

    const outlineLength = markPathEl.getTotalLength();
    const traceCount = Math.round(CONFIG.particleCount * 0.3);
    for (let i = 0; i < traceCount; i++) {
      const pt = markPathEl.getPointAtLength(((i + 0.5) / traceCount) * outlineLength);
      pool.push({ x: MARK_X + pt.x * MARK_K, y: MARK_Y + pt.y * MARK_K });
    }

    const pick = mulberry32(CONFIG.seed ^ 0x9e3779b9);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(pick() * (i + 1));
      const tmp = pool[i];
      pool[i] = pool[j];
      pool[j] = tmp;
    }
    for (let i = 0; i < CONFIG.particleCount; i++) {
      const pt = pool[i % pool.length];
      targets.push({
        x: pt.x,
        y: pt.y,
        lx: (pt.x - MARK_X) / MARK_K,
        ly: (pt.y - MARK_Y) / MARK_K
      });
    }
  })();

  /* ══════════════════════════════════════════════════════════════════════
   * 4 · Particle sprites — soft light, never neon
   * ══════════════════════════════════════════════════════════════════════ */
  const SPRITE_PX = 128;
  const SPRITE_SPEC = {
    0: { box: 3.6, stops: [[0, 1], [0.14, 0.96], [0.34, 0.5], [0.6, 0.14], [0.82, 0.03], [1, 0]] },
    1: { box: 2.9, stops: [[0, 0.92], [0.2, 0.66], [0.45, 0.3], [0.72, 0.08], [1, 0]] },
    2: { box: 1.55, stops: [[0, 0.55], [0.4, 0.48], [0.7, 0.26], [0.9, 0.05], [1, 0]] }
  };
  const SPRITE_BOX = [SPRITE_SPEC[0].box, SPRITE_SPEC[1].box, SPRITE_SPEC[2].box];

  function makeSprite(color, key) {
    const c = document.createElement('canvas');
    c.width = c.height = SPRITE_PX;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(SPRITE_PX / 2, SPRITE_PX / 2, 0,
      SPRITE_PX / 2, SPRITE_PX / 2, SPRITE_PX / 2);
    for (const [stop, alpha] of SPRITE_SPEC[key].stops) {
      grd.addColorStop(stop, rgba(color, alpha));
    }
    g.fillStyle = grd;
    g.fillRect(0, 0, SPRITE_PX, SPRITE_PX);
    return c;
  }

  const sprites = TINTS.map(color => [
    makeSprite(color, 0), makeSprite(color, 1), makeSprite(color, 2)
  ]);

  /* ══════════════════════════════════════════════════════════════════════
   * 5 · Build the field
   * ══════════════════════════════════════════════════════════════════════ */
  const rng = mulberry32(CONFIG.seed);
  const parts = [];

  for (let i = 0; i < CONFIG.particleCount; i++) {
    const tgt = targets[i % targets.length];

    /* depth strata: far dust, mid points, a few near bokeh */
    const roll = rng();
    let depth, size, baseAlpha, softLevel;
    if (roll < 0.55) {
      depth = 0.10 + rng() * 0.25;
      size = 0.55 + rng() * 0.55;
      baseAlpha = 0.17 + rng() * 0.20;
      softLevel = 1;
    } else if (roll < 0.90) {
      depth = 0.40 + rng() * 0.30;
      size = 0.95 + rng() * 1.05;
      baseAlpha = 0.24 + rng() * 0.24;
      softLevel = 1;
    } else {
      depth = 0.72 + rng() * 0.28;
      size = 2.1 + rng() * 2.9;
      baseAlpha = 0.07 + rng() * 0.09;
      softLevel = 2;
    }

    const ang = rng() * TAU;
    const rad = Math.pow(rng(), 1.35);
    const bx = CORE.x + Math.cos(ang) * rad * 940;
    const by = CORE.y + Math.sin(ang) * rad * 500;

    const tint = rng() < 0.68 ? 0 : rng() < 0.74 ? 1 : rng() < 0.88 ? 2 : 3;
    const swirl = 0.22 + (rng() * 2 - 1) * 0.85;
    const coreR = 2 + Math.pow(rng(), 0.75) * 24;

    /* assembly delay follows the target's x so light writes left to right */
    const ad = 0.02 + ((tgt.lx - VX0) / (VX1 - VX0)) * 0.10 + rng() * 0.02;
    const dustAng = Math.atan2(tgt.y - CORE.y, (tgt.x - CORE.x) * 0.9) + (rng() - 0.5) * 0.9;
    const dustSp = 26 + rng() * 62;

    parts.push({
      bx, by, depth, size, baseAlpha, softLevel, tint,
      tw: 0.35 + rng() * 0.95,
      twp: rng() * TAU,
      rate: 0.55 + depth * 0.85,
      ax: (6 + rng() * 26) * (0.4 + depth),
      ay: (5 + rng() * 22) * (0.4 + depth),
      w1: 0.16 + rng() * 0.26,
      w2: 0.34 + rng() * 0.5,
      w3: 0.14 + rng() * 0.24,
      w4: 0.3 + rng() * 0.45,
      ph1: rng() * TAU, ph2: rng() * TAU, ph3: rng() * TAU, ph4: rng() * TAU,

      delay: Math.pow(rng(), 1.7) * 0.18,
      arrive: TL.mergeEnd - 0.30 + rng() * 0.30,
      swirl,
      coreR,
      coreA: rng() * TAU,

      tx: tgt.x, ty: tgt.y,
      ad,
      arc: 9 + rng() * 20,
      ms: 1.75 + rng() * 0.85,

      dx: Math.cos(dustAng) * dustSp,
      dy: Math.sin(dustAng) * dustSp * 0.7 - 22,
      trail: rng() < 0.78
    });
  }

  /* ══════════════════════════════════════════════════════════════════════
   * 6 · Trajectory — a pure function of time, so replay is exact
   * ══════════════════════════════════════════════════════════════════════ */
  const tmpA = { x: 0, y: 0 };
  const HEAD = { x: 0, y: 0 };
  const TAIL = { x: 0, y: 0 };
  const MID = { x: 0, y: 0 };
  const LOOK = { a: 0, s: 0, l: 0 };

  function ambientAt(p, t, out) {
    const tz = t * p.rate;
    const dx = Math.sin(tz * p.w1 + p.ph1) * p.ax
             + Math.sin(tz * p.w2 + p.ph2) * p.ax * 0.35;
    const dy = Math.cos(tz * p.w3 + p.ph3) * p.ay
             + Math.sin(tz * p.w4 + p.ph4) * p.ay * 0.30;
    const rot = t * 0.012;
    const c = Math.cos(rot), s = Math.sin(rot);
    const x = p.bx - CORE.x + dx;
    const y = p.by - CORE.y + dy;
    out.x = CORE.x + x * c - y * s;
    out.y = CORE.y + x * s + y * c;
    return out;
  }

  function positionAt(p, t, out) {
    if (t <= TL.ambientEnd) return ambientAt(p, Math.max(0, t), out);

    /* the compressed core, shrinking to nothing by crushEnd */
    const crush = smooth(2.60, TL.crushEnd, t);
    const cr = p.coreR * (1 - crush);
    const ca = p.coreA + t * 0.85;
    const cx = CORE.x + Math.cos(ca) * cr;
    const cy = CORE.y + Math.sin(ca) * cr;

    if (t < TL.assembleStart) {
      const q = clamp01((t - TL.ambientEnd - p.delay) /
        (p.arrive - TL.ambientEnd - p.delay));
      ambientAt(p, t, tmpA);
      const phi = p.swirl * Math.pow(q, 1.4);
      const c = Math.cos(phi), s = Math.sin(phi);
      const dx = tmpA.x - CORE.x;
      const dy = tmpA.y - CORE.y;
      const shrink = 1 - Math.pow(q, 2.2);
      out.x = cx + (dx * c - dy * s) * shrink;
      out.y = cy + (dx * s + dy * c) * shrink;
      return out;
    }

    /* assembly: core → letter, along one coherent vortex */
    const span = TL.assembleEnd - TL.assembleStart;
    const a = clamp01((t - TL.assembleStart - p.ad) / (span - p.ad));
    const e = easeOutQuart(a);
    let x = cx + (p.tx - cx) * e;
    let y = cy + (p.ty - cy) * e;

    const vx = -(p.ty - CORE.y);
    const vy = (p.tx - CORE.x);
    const vl = Math.hypot(vx, vy) || 1;
    const arc = Math.sin(Math.PI * a) * p.arc;
    x += (vx / vl) * arc;
    y += (vy / vl) * arc;

    if (t > TL.dustStart) {
      const d = clamp01((t - TL.dustStart) / (TL.dustEnd - TL.dustStart));
      const de = easeOutCubic(d);
      x += p.dx * de + Math.sin(d * 4 + p.ph1) * 5 * d;
      y += p.dy * de;
    }

    out.x = x;
    out.y = y;
    return out;
  }

  function lookAt(p, t) {
    const twinkle = 0.82 + 0.18 * Math.sin(t * p.tw + p.twp);
    let a = p.baseAlpha * twinkle * smooth(0, 0.42, t);
    let s = p.size;
    let l = p.softLevel;

    if (t > TL.ambientEnd) {
      const q = clamp01((t - TL.ambientEnd - p.delay) /
        (p.arrive - TL.ambientEnd - p.delay));
      const qe = Math.pow(q, 1.35);
      a = lerp(a, 0.92, qe);
      s = lerp(s, 1.5, qe);
      if (q > 0.5) l = 0;
    }

    if (t > TL.assembleStart) {
      const span = TL.assembleEnd - TL.assembleStart;
      const as = clamp01((t - TL.assembleStart - p.ad) / (span - p.ad));
      const ae = easeOutCubic(as);
      a = lerp(a, 0.95, ae);
      s = lerp(s, p.ms, ae);
      l = 0;
      if (t > TL.dustStart) {
        const d = clamp01((t - TL.dustStart) / (TL.dustEnd - TL.dustStart));
        a *= 1 - smooth(0, 1, d);
        s *= 1 - 0.35 * d;
      }
    }

    LOOK.a = a;
    LOOK.s = s;
    LOOK.l = l;
  }

  /* ══════════════════════════════════════════════════════════════════════
   * 7 · Render
   * ══════════════════════════════════════════════════════════════════════ */
  let renderScale = 1;

  function bloomAt(t) {
    const gather = smooth(1.90, 2.95, t) * 0.20;
    const pulse = Math.exp(-Math.pow((t - TL.flash) / 0.11, 2)) * 0.58;
    const fade = 1 - smooth(3.45, 4.42, t);
    return {
      a: (gather + pulse) * fade,
      r: 150 + 420 * smooth(1.90, TL.flash, t) + 260 * smooth(TL.flash, 3.90, t)
    };
  }

  function drawBloom(a, r) {
    if (r < 1) return;
    const g = ctx.createRadialGradient(CORE.x, CORE.y, 0, CORE.x, CORE.y, r);
    g.addColorStop(0, rgba(INK, a));
    g.addColorStop(0.10, rgba(INK, a * 0.70));
    g.addColorStop(0.30, rgba(ICE, a * 0.22));
    g.addColorStop(0.62, rgba(BLUE, a * 0.06));
    g.addColorStop(1, rgba(BLUE, 0));
    ctx.fillStyle = g;
    ctx.fillRect(CORE.x - r, CORE.y - r, r * 2, r * 2);
  }

  function clearCanvas() {
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.fillStyle = BG_CSS;
    ctx.fillRect(0, 0, CONFIG.stage.w, CONFIG.stage.h);
  }

  function draw(t) {
    clearCanvas();
    if (t >= TL.end - 0.004) return;   // at rest the mark is vector, not light

    ctx.globalCompositeOperation = 'lighter';

    const bloom = bloomAt(t);
    if (bloom.a > 0.003) drawBloom(bloom.a, bloom.r);

    const trailOn = t > TL.ambientEnd + 0.02 && t < TL.dustEnd;

    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      positionAt(p, t, HEAD);
      lookAt(p, t);

      const a = LOOK.a;
      if (a <= 0.004) continue;
      const s = LOOK.s;
      const box = s * SPRITE_BOX[LOOK.l];

      if (trailOn && p.trail) {
        const tailT = Math.max(TL.ambientEnd, t - CONFIG.look.trail);
        positionAt(p, tailT, TAIL);
        const tdx = HEAD.x - TAIL.x;
        const tdy = HEAD.y - TAIL.y;
        if (tdx * tdx + tdy * tdy > 5) {
          ctx.globalAlpha = a * 0.30;
          ctx.strokeStyle = TINT_CSS[p.tint];
          ctx.lineWidth = Math.max(0.55, s * 0.55);
          ctx.beginPath();
          ctx.moveTo(TAIL.x, TAIL.y);
          const n = CONFIG.look.trailSamples;
          for (let k = n; k >= 1; k--) {
            positionAt(p, tailT + (t - tailT) * (1 - k / (n + 1)), MID);
            ctx.lineTo(MID.x, MID.y);
          }
          ctx.lineTo(HEAD.x, HEAD.y);
          ctx.stroke();
        }
      }

      ctx.globalAlpha = a;
      ctx.drawImage(sprites[p.tint][LOOK.l], HEAD.x - box / 2, HEAD.y - box / 2, box, box);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ══════════════════════════════════════════════════════════════════════
   * 8 · Clock, class cues, lifecycle
   * ══════════════════════════════════════════════════════════════════════ */
  const flags = { lit: false, named: false, breath: false, done: false };
  let raf = 0;
  let t0 = 0;
  let frozen = false;
  let hiddenAt = 0;

  function syncCues(t) {
    if (!flags.lit && t >= TL.markIn) {
      flags.lit = true;
      root.classList.add('is-lit');
    }
    if (!flags.named && t >= TL.lockup) {
      flags.named = true;
      root.classList.add('is-named');
    }
    if (!flags.breath && t >= TL.breathe) {
      flags.breath = true;
      root.classList.add('is-breathing');
    }
    if (!flags.done && t >= TL.ui) {
      flags.done = true;
      root.classList.add('is-done');
    }
  }

  function tick(now) {
    const t = Math.min(TL.end, (now - t0) / 1000);
    draw(t);
    syncCues(t);
    if (t >= TL.end) {
      frozen = true;
      raf = 0;
      return;
    }
    raf = requestAnimationFrame(tick);
  }

  function resize() {
    const s = Math.min(window.innerWidth / CONFIG.stage.w,
      window.innerHeight / CONFIG.stage.h);
    stageInner.style.transform = `translate(-50%, -50%) scale(${s})`;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderScale = Math.min(Math.max(s * dpr, 1), 2.25);

    const w = Math.round(CONFIG.stage.w * renderScale);
    const h = Math.round(CONFIG.stage.h * renderScale);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      if (frozen) clearCanvas();
    }
  }

  function showStatic(instant) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    frozen = true;
    clearCanvas();
    if (instant) root.classList.add('is-still');
    root.classList.add('is-lit', 'is-named', 'is-done');
  }

  function replay() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    frozen = false;

    root.classList.add('is-resetting');
    root.classList.remove('is-lit', 'is-named', 'is-breathing', 'is-done');
    void root.offsetWidth;
    root.classList.remove('is-resetting');

    flags.lit = flags.named = flags.breath = flags.done = false;

    if (still) { showStatic(true); return; }
    if (reduced) {
      clearCanvas();
      root.classList.remove('is-lit', 'is-named', 'is-done');
      void root.offsetWidth;
      root.classList.add('is-lit', 'is-named', 'is-done');
      frozen = true;
      return;
    }

    clearCanvas();
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
  }

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (err) {
      console.warn('Fullscreen is unavailable here.', err);
    }
  }

  document.getElementById('replay').addEventListener('click', replay);
  document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);

  document.addEventListener('fullscreenchange', () => {
    document.getElementById('fullscreen')
      .setAttribute('aria-pressed', String(Boolean(document.fullscreenElement)));
    requestAnimationFrame(resize);
  });

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'r' || e.key === 'R') replay();
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      hiddenAt = performance.now();
    } else if (hiddenAt) {
      t0 += performance.now() - hiddenAt;
      hiddenAt = 0;
    }
  });

  let resizeQueued = 0;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(resizeQueued);
    resizeQueued = requestAnimationFrame(resize);
  });
  window.addEventListener('orientationchange', () => requestAnimationFrame(resize));

  const onReducedChange = (e) => {
    reduced = e.matches;
    if (reduced) showStatic(false);
    else replay();
  };
  if (reducedQuery.addEventListener) reducedQuery.addEventListener('change', onReducedChange);
  else if (reducedQuery.addListener) reducedQuery.addListener(onReducedChange);

  /* ══════════════════════════════════════════════════════════════════════
   * 9 · Start
   * ══════════════════════════════════════════════════════════════════════ */
  resize();

  if (still || reduced) {
    showStatic(still);
  } else {
    clearCanvas();
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
